<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <title>Núcleo 24H — logotipo principal</title>
  <desc>Logotipo vectorial en azul petróleo y verde natural, con una N geométrica y un check de cumplimiento.</desc>
  <g id="isotipo" transform="translate(36,48)">
    <!-- N geométrica -->
    <path d="M 0,0 H 58 L 183,126 V 0 H 238 V 270 H 187 L 55,137 V 270 H 0 Z" fill="#123047"/>
    <!-- Corte interior que limpia la diagonal y da más aire al símbolo -->
    <path d="M 58,0 L 183,126 V 74 L 104,0 Z" fill="#123047"/>
    <!-- Acento verde de base -->
    <path d="M 183,216 L 238,216 V 270 H 183 Z" fill="#527A3C"/>
    <!-- Check de cumplimiento -->
    <path d="M 166,205 L 190,229 L 229,185" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <g id="wordmark" font-family="Manrope, Inter, Arial, sans-serif">
    <text x="330" y="190" font-size="116" font-weight="800" letter-spacing="1.5" fill="#123047">NÚCLEO</text>
    <text x="333" y="280" font-size="72" font-weight="800" letter-spacing="4" fill="#527A3C">24H</text>
    <path d="M 333,310 H 600" stroke="#527A3C" stroke-width="5"/>
    <text x="333" y="355" font-size="24" font-weight="600" letter-spacing="3.4" fill="#123047">GESTIÓN Y CUMPLIMIENTO INTEGRAL</text>
  </g>
</svg>